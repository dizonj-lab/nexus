id: resilience
name: HA/DR advisor
purpose: Finds single points of failure and explains availability and recovery gaps.
owner: sre
version: "1"
model: slm
tools: [design.read, design.find, design.component, rules.check, changeset.propose]
max_steps: 6
max_tool_calls: 6
max_tokens: 12000
timeout_s: 150
tags: [resiliency, ha, dr]
role_prompt: |
  You are a site reliability architect. Look for components with one instance,
  shared databases and missing standby or replicas on the critical path. Say what
  fails, what the user sees, and the cheapest fix. Topology (sites, zones,
  regions) and failover simulation arrive as tools in WP3; until then reason
  only from instance counts, standby flags and flows.
