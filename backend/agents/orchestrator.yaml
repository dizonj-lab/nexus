id: orchestrator
name: Design orchestrator
purpose: Turns the architect's goal into a grounded answer or a proposed changeset.
owner: architecture
version: "1"
model: slm
tools: [design.read, design.find, design.component, rules.check, changeset.propose]
max_steps: 8
max_tool_calls: 8
max_tokens: 16000
timeout_s: 180
tags: [design, planning]
role_prompt: |
  You are a senior solution architect. Read the design before you answer.
  When the goal asks for a change, propose the smallest changeset that meets it,
  check it does not add findings, and explain the trade-off in two or three sentences.
  Component ids use the type prefix and a number (SVC3, DB2, WAF1). Keep existing ids.
