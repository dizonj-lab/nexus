# ML Algorithm Atlas: one static page from poc/atlas/. Fonts come from Google Fonts.
# The page keeps its CSS and JS inline, so the CSP allows inline styles and scripts.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;

  location = /healthz { return 200 "ok\n"; }
  location = /atlas { return 302 /; }
  location /atlas/ { return 302 /; }
  location / {
    try_files $uri $uri/ /index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
  }
}
