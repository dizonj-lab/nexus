# ML Algorithm Atlas only, on its own port: ./deploy/atlas.sh
#   → http://<buddy>:8095/
# Serves poc/atlas/ read-only, so a git pull updates the page with no restart.
name: nexus-atlas
services:
  atlas:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../poc/atlas:/usr/share/nginx/html:ro
      - ./atlas.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NEXUS_ATLAS_BIND:-0.0.0.0}:${NEXUS_ATLAS_PORT:-8095}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
