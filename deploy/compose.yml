# NEXUS test site on Buddy (home LLM server, 192.168.1.93).
#   cd nexus && docker compose -f deploy/compose.yml up -d --build
#   → http://192.168.1.93:8088      prototype
#   → http://192.168.1.93:8088/c4/  LikeC4 architecture
# Host port is configurable because 3000/8080 are often taken by Open WebUI etc.:
#   NEXUS_PORT=8090 docker compose -f deploy/compose.yml up -d --build
# Model server for the architect console (default: Ollama on Buddy):
#   NEXUS_LLM_UPSTREAM=http://host.docker.internal:8000 docker compose -f deploy/compose.yml up -d --build
name: nexus
services:
  site:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nexus-site:latest
    ports:
      - "${NEXUS_PORT:-8088}:8080"
    restart: unless-stopped
    environment:
      # OpenAI-compatible model server on Buddy. Ollama listens on 11434,
      # vLLM usually on 8000. The console calls it at /llm/v1.
      NEXUS_LLM_UPSTREAM: ${NEXUS_LLM_UPSTREAM:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
