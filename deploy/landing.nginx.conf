# Static landing page. Fonts come from Google Fonts; everything else is served from here.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

  location = /healthz { return 200 "ok\n"; }
  location /media/ { add_header Cache-Control "public, max-age=86400" always; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; script-src 'self'; frame-ancestors 'none'" always; }
}
